<style>
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
/* Layout: quiet xerox workbench. Big word field + taped sheet on a flat grey board (left), plain labelled cards (right). Brick red and candy pink, taken from the Z tile the user picked; one look in every theme. */
:root{
  --bg:#f7d3dc; --paper:#fff6f8; --board:#f0bccb; --ink:#4f1417; --muted:#8b4b55; --line:#4f1417; --hover:#ffe6ec;
  --accent:#9e2b2e; --accent-ink:#ffc4d3; --pink:#ffc4d3;
  --display:"Black Han Sans","Archivo Black",sans-serif;
  --ui:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"DM Mono","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:15px; line-height:1.55; overflow-x:clip;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:24px 56px}
.wrap{max-width:1280px; margin:0 auto; display:grid; gap:26px}

header{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px}
#logo{height:104px; width:auto; max-width:100%; cursor:pointer; display:block}
.sticker{margin:0; font:400 clamp(20px,2.6vw,28px)/1.2 var(--display); max-width:16ch; text-align:right; text-wrap:balance}
.sticker em{font-style:normal; background:var(--ink); color:var(--paper); padding:0 6px}

.app{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:26px; align-items:start}
@media (max-width:920px){ .app{grid-template-columns:minmax(0,1fr)} #logo{height:72px} .sticker{text-align:left} }
.stagecol{display:grid; gap:20px; min-width:0}

.typer{background:var(--paper); border:2px solid var(--line); display:grid}
.typer:focus-within{box-shadow:4px 4px 0 var(--accent)}
.typer label{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:10px 14px 0; color:var(--muted)}
textarea{width:100%; min-height:88px; resize:vertical; border:0; background:transparent; color:var(--ink);
  font:400 clamp(30px,5vw,46px)/1.15 var(--display); padding:2px 14px 12px}
textarea:focus-visible{outline:none}

.board{position:relative; min-height:470px; padding:60px 28px 64px; display:grid; place-items:center; overflow:hidden;
  background:var(--board); border:2px solid var(--line)}
.board-tag{position:absolute; top:14px; left:14px; max-width:calc(100% - 28px); display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink);
  background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:4px 12px 4px 4px}
.board-tag b{font:400 12px/1 var(--display); letter-spacing:.04em; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:5px 9px 4px}
.boardfoot{position:absolute; left:14px; right:14px; bottom:14px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px}
.boardfoot span{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.boardfoot span:empty{display:none}
.sheet{position:relative; max-width:100%; line-height:0; transform:rotate(-.5deg); box-shadow:0 12px 26px rgba(79,20,23,.22)}
.sheet::before,.sheet::after{content:""; position:absolute; width:86px; height:24px; z-index:1; pointer-events:none; background:rgba(255,255,255,.55);
  box-shadow:0 1px 2px rgba(20,20,20,.08)}
.sheet::before{top:-10px; left:-22px; transform:rotate(-30deg)}
.sheet::after{bottom:-10px; right:-22px; transform:rotate(-30deg)}
.sheet.clear{background-color:#ffffff; background-image:conic-gradient(#e2e2e2 25%, transparent 0 50%, #e2e2e2 0 75%, transparent 0); background-size:18px 18px}
#out{display:block; max-width:100%; height:auto; cursor:pointer}
.loading{display:block; padding:28px 34px; line-height:1.4; background:var(--paper); font-family:var(--mono); font-size:12px}

.controls{display:grid; gap:24px; padding-top:12px}
.card{position:relative; background:var(--paper); border:2px solid var(--line); padding:26px 16px 16px; display:grid; gap:16px}
.card h2{position:absolute; top:-14px; left:12px; margin:0; font:400 16px/1 var(--display); background:var(--accent); color:var(--accent-ink); padding:6px 11px 5px; transform:rotate(-1.5deg)}
.field{display:grid; gap:8px}
.lbl{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center}
.lbl output{color:var(--ink); font-variant-numeric:tabular-nums}

button{font:700 14px var(--ui); border-radius:8px; padding:11px 12px; cursor:pointer; border:2px solid var(--line); background:var(--paper); color:var(--ink); transition:transform .08s}
button:hover{background:var(--hover)}
button:active{transform:translate(1px,1px)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
button.primary:hover{background:var(--accent); filter:brightness(1.08)}

.tabs{display:flex; flex-wrap:wrap; gap:6px}
.tabs button{padding:5px 11px; border-radius:999px; font-size:13px; border-width:1.5px}
.tabs button[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

.pals{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.choice{position:relative; display:block}
.choice input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.choice span{display:grid; gap:6px; padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:13px; font-weight:700; background:var(--paper); cursor:pointer}
.choice span:hover{background:var(--hover)}
.choice input:checked + span{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.choice input:focus-visible + span{outline:3px solid var(--accent); outline-offset:2px}
.sw{display:flex; gap:2px}
.sw i{flex:1; height:12px; border-radius:2px; box-shadow:inset 0 0 0 1px rgba(20,20,20,.15)}
.sw.big i{height:24px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.seg .choice span{text-align:center; padding:7px 4px}

.editor{display:grid; gap:12px}
.reco{display:grid; gap:8px; padding-bottom:14px; border-bottom:1.5px dashed var(--line)}
.moodrow{display:flex; gap:6px}
.moodrow input{flex:1; min-width:0; font:700 14px var(--ui); padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink)}
.moodrow input:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
.moodrow button{padding:9px 14px}
.examples, .preset-row{display:flex; flex-wrap:wrap; gap:6px}
.exlbl{flex-basis:100%; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); margin-top:2px}
.examples button, .pchip{padding:4px 10px; font-size:12px; border-radius:999px; border-width:1.5px}
.recos{display:grid; gap:8px}
.recos:empty{display:none}
.reco-card{display:grid; gap:6px; padding:8px; text-align:left; font-size:12px; border-width:1.5px}
.reco-card.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chips{display:flex; flex-wrap:wrap; gap:12px}
.chip{position:relative}
.chip label{display:block; position:relative; width:40px; height:40px; border-radius:8px; border:1.5px solid var(--line); cursor:pointer; overflow:hidden}
.chip input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0}
.chip .x{position:absolute; top:-8px; right:-8px; width:21px; height:21px; padding:0; border-radius:50%; font-size:12px; line-height:1; border-width:1.5px}
.chips .add{width:40px; height:40px; padding:0; font-size:20px; border-style:dashed}
.hint{font-size:12px; color:var(--muted); margin:0}
.editor .from{padding:8px 10px; font-size:13px; border-width:1.5px}

input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:4px; margin:10px 0; background:var(--ink); border-radius:999px; cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--pink); border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--pink); border:2px solid var(--ink)}
input[type=range]:focus-visible{outline:3px solid var(--accent); outline-offset:6px}
.toggles{display:grid; gap:10px}
.tg{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; cursor:pointer}
.tg input{width:18px; height:18px; accent-color:var(--accent); margin:0}

.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.actions button{font:400 18px/1.1 var(--display); padding:15px 10px}
#shuffle{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
#shuffle:hover{filter:brightness(1.05)}
.note{margin:-12px 0 0; font-size:13px; color:var(--muted); min-height:1.5em}
.actions #shuffle{grid-column:1 / -1}
.actions #download, .actions #copy{font-size:16px; padding:12px 8px}
/* keep every control column inside the screen on phones */
.app > *, .controls, .card, .field, .editor, .reco, .recos, .moodrow, .pals, .chips, .tabs, .examples{min-width:0}
.controls, .card, .editor, .reco, .recos, .field{grid-template-columns:minmax(0,1fr)}
.pals{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.moodrow input{width:0}
.moodrow button{flex:none}
.reco-card, .reco-card .sw{min-width:0; width:100%}
.reco-card .sw i{min-width:0}
.new{font:400 10px/1 var(--display); letter-spacing:.06em; background:var(--accent); color:var(--accent-ink); padding:4px 7px 3px; border-radius:999px}
.card.event{background:#fff4e6}
.card.event h2{background:#4a2a1e; color:#ffc4d3}
.topping{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; cursor:pointer}
.topping input{position:absolute; opacity:0; width:1px; height:1px}
.sw-track{width:52px; height:30px; border-radius:999px; background:#d9c6b4; border:2px solid var(--line); position:relative; transition:background .15s}
.sw-knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid var(--line); transition:transform .15s}
.topping input:checked + .sw-track{background:#4a2a1e}
.topping input:checked + .sw-track .sw-knob{transform:translateX(22px); background:#ffc4d3}
.topping input:focus-visible + .sw-track{outline:3px solid var(--ink); outline-offset:2px}
.topping-txt{display:grid; gap:2px; min-width:0}
.topping-txt b{font-size:15px}
.topping-txt small{font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="CUT & PASTE" title="눌러서 다시 오리기">
  </header>

  <div class="app">
    <div class="stagecol">
      <div class="typer">
        <label for="text">문구 입력</label>
        <textarea id="text" spellcheck="false">빼빼로</textarea>
      </div>
      <section class="board" aria-label="미리보기">
        <span class="board-tag"><b>TIP</b>각 글자 터치 시 디자인을 수정할 수 있어요!</span>
        <div class="sheet" id="sheet"><span class="loading" id="loading">폰트 오리는 중…</span><img id="out" alt="오려 붙인 글자 이미지" hidden></div>
        <div class="boardfoot"><span></span><span id="dims"></span></div>
      </section>
    </div>

    <aside class="controls" aria-label="설정">
      <section class="card event">
        <h2>11.11 빼빼로데이</h2>
        <label class="topping" for="sprinkle">
          <input type="checkbox" id="sprinkle">
          <span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span>
          <span class="topping-txt"><b>스프링클 토핑 뿌리기</b><small>초코, 딸기, 화이트, 아몬드 조각을 글자마다 뿌려요</small></span>
          <span class="new">NEW</span>
        </label>
      </section>
      <section class="card">
        <h2>종이 팔레트</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="pals" id="pals"></div>
        <div class="editor" id="editor" hidden>
          <div class="reco">
            <label class="lbl" for="mood">느낌으로 추천받기</label>
            <div class="moodrow"><input type="text" id="mood" placeholder="예: 봄 파스텔, 딸기 케이크, 레트로 카페" autocomplete="off"><button type="button" class="primary" id="moodGo">추천</button></div>
            <div class="examples" id="examples"></div>
            <div class="recos" id="recos"></div>
          </div>
          <div class="chips" id="chips"></div>
          <p class="hint">칩을 누르면 색을 바꿀 수 있어요. 2~12색까지 넣을 수 있고, 글자색은 이 색들과 검정, 흰색 중에서 자동으로 골라요.</p>
          <button type="button" class="from" id="fromCur">지금 고른 팔레트로 시작하기</button>
        </div>
      </section>

      <section class="card alt">
        <h2>오리는 방식</h2>
        <div class="field">
          <label class="lbl" for="size">글자 크기 <output id="sizeOut">130</output></label>
          <input type="range" id="size" min="60" max="240" value="130">
        </div>
        <div class="field">
          <label class="lbl" for="jitter">흐트러짐 <output id="jitterOut">7°</output></label>
          <input type="range" id="jitter" min="0" max="16" value="7">
        </div>
        <div class="field">
          <span class="lbl">바탕</span>
          <div class="seg">
            <label class="choice"><input type="radio" name="bg" id="bgWhite" value="white" checked><span>흰 종이</span></label>
            <label class="choice"><input type="radio" name="bg" id="bgBlack" value="black"><span>검정</span></label>
            <label class="choice"><input type="radio" name="bg" id="bgClear" value="clear"><span>투명</span></label>
          </div>
        </div>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="mix" checked> 대소문자 섞기</label>
          <label class="tg"><input type="checkbox" id="shadow" checked> 종이 그림자</label>
        </div>
      </section>

      <div class="actions">
        <button class="primary" id="shuffle">다시 섞기</button>
        <button id="download">PNG 다운로드</button>
        <button id="copy">이미지 복사</button>
      </div>
      <p class="note" id="note"></p>
    </aside>
  </div>
</div>

const ri=n=>Math.floor(Math.random()*n), rr=(a,b)=>a+Math.random()*(b-a), pick=a=>a[ri(a.length)];
function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function contrastPick(bg,list,min=3.2){const s=[...list].sort(()=>Math.random()-.5);return s.find(c=>ratio(bg,c)>=min)||(lum(bg)>.4?'#111111':'#ffffff')}

function colorize(s,pal){const P=PALETTES[pal];
  s.bg=pick(P.bg); s.fg=contrastPick(s.bg,P.fg);
  s.alt=contrastPick(s.fg,P.fg.concat(P.bg).filter(c=>c!==s.fg&&c!==s.bg),2);
  const rest=P.bg.filter(c=>c!==s.bg);s.under=pick(rest.length?rest:P.bg);}
function newStyle(pal){
  const s={font:pick(FONTS),kfont:pick(KFONTS),scale:rr(.82,1.22),rot:rr(-1,1),dy:rr(-1,1),r:Array.from({length:64},Math.random),pad:rr(.1,.26),upper:Math.random()<.5};
  const p=Math.random(); s.shape=p<.55?'rect':p<.76?'torn':p<.9?'skew':'round';
  const t=Math.random(); s.text=t<.62?'plain':t<.76?'shadow':t<.87?'outline':'tight';
  if(s.text==='tight') s.pad=rr(.04,.08);
  s.double=Math.random()<.16; colorize(s,pal); return s;
}

let noise;
function makeNoise(){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');const d=x.createImageData(96,96);
  for(let i=0;i<d.data.length;i+=4){const v=ri(256);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c}

function shapePath(ctx,s,w,h){
  let k=0;const R=()=>s.r[(k++)%s.r.length]*2-1;
  const j=Math.min(w,h)*.07,x0=-w/2,y0=-h/2,x1=w/2,y1=h/2;
  ctx.beginPath();
  if(s.shape==='round'){ctx.roundRect(x0,y0,w,h,Math.min(w,h)*(.15+s.r[0]*.3));return}
  let pts=[[x0+R()*j,y0+R()*j],[x1+R()*j,y0+R()*j],[x1+R()*j,y1+R()*j],[x0+R()*j,y1+R()*j]];
  if(s.shape==='skew'){const sk=w*.07*R();pts[0][0]+=sk;pts[1][0]+=sk;pts[2][0]-=sk;pts[3][0]-=sk}
  if(s.shape==='torn'){const out=[],tj=Math.max(1.5,h*.022);
    for(let e=0;e<4;e++){const a=pts[e],b=pts[(e+1)%4],n=e%2?7:10;
      for(let q=0;q<n;q++){const t=q/n;let x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;if(q>0){x+=R()*tj;y+=R()*tj}out.push([x,y])}}
    pts=out}
  ctx.moveTo(pts[0][0],pts[0][1]);for(let q=1;q<pts.length;q++)ctx.lineTo(pts[q][0],pts[q][1]);ctx.closePath();
}

function measure(ctx,s,ch,base){
  const F=isK(ch)?s.kfont:s.font,size=base*s.scale;ctx.font=fontStr(F,size);const m=ctx.measureText(ch);
  const L=m.actualBoundingBoxLeft||0,Rt=m.actualBoundingBoxRight||m.width,A=m.actualBoundingBoxAscent||size*.7,D=m.actualBoundingBoxDescent||0;
  const gw=Math.max(L+Rt,size*.22),gh=Math.max(A+D,size*.3);
  return {F,size,L,Rt,A,D,w:gw+size*s.pad*2,h:gh+size*s.pad*1.6};
}

function setShadow(ctx,on,h){if(on){ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=h*.06;ctx.shadowOffsetX=h*.015;ctx.shadowOffsetY=h*.03}else{ctx.shadowColor='transparent'}}
function drawTile(ctx,t,o){
  const s=t.s;ctx.save();ctx.translate(t.cx,t.cy);ctx.rotate(s.rot*o.jitter*Math.PI/180);
  if(s.double){ctx.save();ctx.rotate((s.r[5]-.5)*.14);ctx.translate((s.r[6]-.5)*t.w*.12,(s.r[7]-.5)*t.h*.12);
    shapePath(ctx,{shape:'rect',r:s.r.slice(12)},t.w*1.12,t.h*1.12);setShadow(ctx,o.shadow,t.h);ctx.fillStyle=s.under;ctx.fill();ctx.restore()}
  shapePath(ctx,s,t.w,t.h);setShadow(ctx,o.shadow,t.h);ctx.fillStyle=s.bg;ctx.fill();setShadow(ctx,false);
  ctx.save();ctx.clip();ctx.globalAlpha=.09;ctx.fillStyle=ctx.createPattern(noise,'repeat');ctx.fillRect(-t.w,-t.h,t.w*2,t.h*2);ctx.restore();
  ctx.font=fontStr(t.F,t.size);ctx.textAlign='left';ctx.textBaseline='alphabetic';
  const x0=-(t.Rt-t.L)/2,y0=(t.A-t.D)/2;
  if(s.text==='shadow'){const off=t.size*.05;ctx.fillStyle=s.alt;ctx.fillText(t.ch,x0+off,y0+off)}
  if(s.text==='outline'){ctx.lineJoin='round';ctx.lineWidth=t.size*.08;ctx.strokeStyle=s.alt;ctx.strokeText(t.ch,x0,y0)}
  ctx.fillStyle=s.fg;ctx.fillText(t.ch,x0,y0);
  if(o.sprinkle)drawSprinkles(ctx,t);
  ctx.restore();
}
const SPRINKLE=['#4a2a1e','#6b3b26','#ff8fb1','#f4b6c8','#fff4e6','#ffffff','#e6b877','#c0392b'];
function drawSprinkles(ctx,t){
  const s=t.s;if(!s.sp)s.sp=Array.from({length:120},Math.random);
  const r=s.sp,n=Math.min(24,Math.round(9+t.w*t.h/(t.size*t.size)*7));
  const len=t.size*.1,wd=Math.max(2,t.size*.032);
  ctx.save();shapePath(ctx,s,t.w,t.h);ctx.clip();ctx.lineCap='round';ctx.lineWidth=wd;
  for(let k=0;k<n;k++){const b=k*4;
    const x=(r[b]-.5)*t.w*.92,y=(r[b+1]-.5)*t.h*.92,a=r[b+2]*Math.PI,c=SPRINKLE[Math.floor(r[b+3]*SPRINKLE.length)];
    const dx=Math.cos(a)*len/2,dy=Math.sin(a)*len/2;
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.moveTo(x-dx+wd*.3,y-dy+wd*.5);ctx.lineTo(x+dx+wd*.3,y+dy+wd*.5);ctx.stroke();
    ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(x-dx,y-dy);ctx.lineTo(x+dx,y+dy);ctx.stroke()}
  ctx.restore();
}

function compose(text,styles,o){
  const c=document.createElement('canvas'),ctx=c.getContext('2d');
  const base=o.base,gap=base*.06,space=base*.38,margin=base*.4,lineGap=base*.14,maxW=o.maxW-margin*2;
  const lines=[[]];let word=[];
  const flush=()=>{if(word.length){lines[lines.length-1].push(word);word=[]}};
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(ch==='\n'){flush();lines.push([]);continue}
    if(/\s/.test(ch)){flush();continue}
    if(!styles[i])styles[i]=newStyle(o.palette);
    const s=styles[i],disp=o.mixCase?(s.upper?ch.toUpperCase():ch.toLowerCase()):ch;
    const m=measure(ctx,s,disp,base);
    word.push({i,s,ch:disp,...m,box:m.w+Math.abs(s.rot*o.jitter)/16*m.h*.3});
  }
  flush();
  const wW=ws=>ws.reduce((a,t)=>a+t.box,0)+gap*(ws.length-1);
  const rows=[];
  for(const words of lines){let row=[],rw=0;
    for(const wd of words){
      const chunks=[];let cur=[];
      for(const t of wd){if(cur.length&&wW([...cur,t])>maxW){chunks.push(cur);cur=[]}cur.push(t)}
      if(cur.length)chunks.push(cur);
      for(const ck of chunks){const cw=wW(ck);
        if(row.length&&rw+space+cw>maxW){rows.push({tiles:row,w:rw});row=[];rw=0}
        let x=row.length?rw+space:0;
        for(const t of ck){t.x=x+t.box/2;x+=t.box+gap;row.push(t)}
        rw=x-gap;
      }
    }
    rows.push({tiles:row,w:rw});
  }
  const contentW=Math.max(base*1.5,...rows.map(r=>r.w));
  const W=Math.ceil(contentW+margin*2);
  let y=margin;const all=[];
  for(const r of rows){const rh=r.tiles.length?Math.max(...r.tiles.map(t=>t.h)):base*.8;const left=margin+(contentW-r.w)/2;
    for(const t of r.tiles){t.cx=left+t.x;t.cy=y+rh/2+t.s.dy*o.jitter/16*base*.12;all.push(t)}
    y+=rh+lineGap}
  const H=Math.ceil(y-lineGap+margin);
  c.width=W;c.height=H;
  if(o.bg!=='clear'){ctx.fillStyle=o.bg==='black'?'#111111':'#ffffff';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.05;ctx.fillStyle=ctx.createPattern(noise,'repeat');ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  for(const t of all)drawTile(ctx,t,o);
  return {canvas:c,tiles:all};
}

function hsl2hex(h,s,l){h=((h%360)+360)%360;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};
  return '#'+f(0)+f(8)+f(4)}
function moodRule(q){
  const hit=MOODS.filter(m=>m.k.some(w=>q.includes(w)));if(!hit.length)return null;
  const avg=(key,i)=>{const g=hit.filter(m=>m[key]);return g.reduce((a,m)=>a+m[key][i],0)/g.length};
  const has=key=>hit.some(m=>m[key]);
  return {hues:hit.flatMap(m=>m.h||[]),s:has('s')?[avg('s',0),avg('s',1)]:[.45,.8],l:has('l')?[avg('l',0),avg('l',1)]:[.35,.8],dark:hit.some(m=>m.dark),hit};
}
function genPalette(rule,n=6){
  const rs=[...rule.hues].sort(()=>Math.random()-.5),base=Math.random()*360,out=[];
  for(let i=0;i<n;i++){
    const h=rs.length?rr(rs[i%rs.length][0],rs[i%rs.length][1]):base+i*360/n+rr(-15,15);
    out.push([h,rr(rule.s[0],rule.s[1]),rr(rule.l[0],rule.l[1])]);
  }
  const ls=out.map(c=>c[2]);
  if(Math.min(...ls)>.5)out[n-1]=[out[0][0],Math.min(rule.s[1],.5),rr(.12,.24)];
  else if(Math.max(...ls)<.55)out[n-1]=[out[0][0],.25,rr(.88,.95)];
  if(rule.dark)out[0]=[rr(220,260),.25,.08];
  return out.map(c=>hsl2hex(c[0],c[1],c[2]));
}
const moodIn=$('mood'),recos=$('recos');let lastSets=[];
const exBtns=a=>a.map(t=>`<button type="button" data-ex="${t}">${t}</button>`).join('');

function recommend(){
  const q=moodIn.value.trim().toLowerCase();
  if(!q){recos.innerHTML='<p class="hint">원하는 느낌을 단어로 적어 주세요. 예시 단어를 눌러도 돼요.</p>';return}
  let rule=moodRule(q),msg;
  if(!rule){const hs=[...q].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),b=hs%360;
    rule={hues:[[b-20,b+20],[b+150,b+210],[b+25,b+55]],s:[.45,.8],l:[.35,.82]};
    msg='딱 맞는 느낌 단어를 찾지 못해서, 입력한 말에서 색 조합을 만들었어요. 예시처럼 계절, 분위기, 색 이름을 섞으면 더 정확해져요.'}
  else msg='읽은 느낌: '+rule.hit.map(m=>m.k[0]).join(', ');
  lastSets=[0,1,2].map(()=>genPalette(rule));
  const pres=Object.entries(PRESET_TAGS).filter(([k,t])=>t.some(w=>q.includes(w))).map(([k])=>k);
  recos.innerHTML=`<p class="hint">${msg}</p>`
    +lastSets.map((cs,i)=>`<button type="button" class="reco-card" data-set="${i}"><span class="sw big">${cs.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>추천 ${i+1} 쓰기</span></button>`).join('')
    +(pres.length?`<p class="hint">비슷한 기본 팔레트 (누르면 내 팔레트로 불러와요)</p><div class="preset-row">${pres.map(k=>`<button type="button" class="pchip" data-preset="${k}">${PALETTES[k].name}</button>`).join('')}</div>`:'')
    +'<button type="button" class="from" id="again">같은 느낌으로 다시 추천</button>';
}

recos.addEventListener('click',e=>{

});

let renderSeq=0;
async function render(){
  if(!ready)return;
  const seq=++renderSeq,txt=els.text.value,byFont=new Map();
  for(let i=0;i<txt.length;i++){const ch=txt[i];if(!isK(ch))continue;
    if(!styles[i])styles[i]=newStyle(palette);
    const fs=fontStr(styles[i].kfont,40);if(!document.fonts.check(fs,ch))byFont.set(fs,(byFont.get(fs)||'')+ch)}
  if(byFont.size){$('loading').textContent='한글 폰트 오리는 중…';
    await Promise.race([Promise.allSettled([...byFont].map(([fs,t])=>document.fonts.load(fs,t))),new Promise(r=>setTimeout(r,6000))]);
    if(seq!==renderSeq)return}
  const o=opts();cur=compose(els.text.value,styles,o);
  els.out.src=cur.canvas.toDataURL('image/png');els.out.hidden=false;$('loading').hidden=true;
  els.sheet.classList.toggle('clear',o.bg==='clear');
  els.dims.textContent=`${cur.canvas.width} × ${cur.canvas.height} px`;
}

function hitAt(img,state,e){const r=img.getBoundingClientRect();const k=state.canvas.width/r.width;
  const x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
  for(let n=state.tiles.length-1;n>=0;n--){const t=state.tiles[n];if(Math.abs(x-t.cx)<=t.w/2&&Math.abs(y-t.cy)<=t.h/2)return t}return null}
els.out.addEventListener('click',e=>{if(!cur)return;const t=hitAt(els.out,cur,e);if(t){styles[t.i]=newStyle(palette);render()}});
els.out.addEventListener('mousemove',e=>{if(cur)els.out.style.cursor=hitAt(els.out,cur,e)?'pointer':'default'});

$('download').addEventListener('click',()=>{
  if(!cur)return;
  const name=(els.text.value.trim().replace(/\s+/g,'_').replace(/[^\w가-힣-]/g,'').slice(0,40)||'cut-paste')+'.png';
  cur.canvas.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);els.note.textContent=name+' 저장했어요.'},'image/png');
});
$('copy').addEventListener('click',async()=>{
  if(!cur)return;
  try{const blob=new Promise(res=>cur.canvas.toBlob(res,'image/png'));

});
